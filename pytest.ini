[pytest]
# Pytest configuration for YOLO circle detection project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Coverage options (uncomment after installing pytest-cov: pip install pytest-cov)
#    --cov=scripts
#    --cov=utils
#    --cov-report=html
#    --cov-report=term-missing

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_gpu: Tests requiring GPU

# Ignore paths
norecursedirs = .git .venv venv env data models outputs reports notebooks __pycache__
