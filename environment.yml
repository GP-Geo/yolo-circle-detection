name: kenya_circles
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.10
  - pip

  # Core dependencies
  - packaging
  - numpy>=1.21.0
  - pandas>=1.3.0
  - geopandas>=0.10.0
  - rasterio>=1.2.0
  - shapely>=1.8.0
  - fiona>=1.8.0

  # Image processing
  - opencv>=4.5.0
  - tifffile>=2021.11.0
  - pillow>=9.0.0

  # Deep learning
  - pytorch>=2.0.0
  - torchvision>=0.15.0

  # Configuration
  - pyyaml>=6.0

  # Visualization
  - matplotlib>=3.5.0
  - seaborn>=0.11.0

  # Testing
  - pytest>=7.0.0
  - pytest-cov>=3.0.0

  # Development
  - black>=22.0.0
  - isort>=5.10.0
  - flake8>=4.0.0

  # Packages only available via pip
  - pip:
      - pydantic>=2.0.0
      - ultralytics>=8.0.0
